name: Build VAN DASH APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source project
        run: |
          unzip -q VAN_DASH_Phone_Build_Kit_v1_2.zip -d vandash-source

      - name: Build APK
        run: gradle -p vandash-source assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VAN-DASH-APK
          path: vandash-source/app/build/outputs/apk/debug/app-debug.apk
